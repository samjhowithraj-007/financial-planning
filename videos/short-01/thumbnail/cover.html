<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family:"DM Sans"; font-weight:700; src:url("fonts/DMSans-700.woff2") format("woff2"); }
  html, body { margin:0; width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"DM Sans", system-ui, sans-serif; font-weight:700; color:#F5F1E8; position:relative;
    background:
      radial-gradient(80% 40% at 50% 100%, rgba(255,176,32,.42), rgba(255,176,32,0) 70%),
      radial-gradient(70% 35% at 50% 0%, rgba(10,240,240,.18), rgba(10,240,240,0) 70%), #0E1116; }
  .grid { position:absolute; inset:0; opacity:.16; background-image:
      linear-gradient(rgba(245,241,232,.12) 2px, transparent 2px), linear-gradient(90deg, rgba(245,241,232,.12) 2px, transparent 2px);
      background-size:90px 90px; }
  .c { color:#0AF0F0; text-shadow:0 0 40px rgba(10,240,240,.65); }
  .a { color:#FFB020; text-shadow:0 0 40px rgba(255,176,32,.55); }
  .r { color:#FF4D4D; text-shadow:0 0 40px rgba(255,77,77,.55); }
  .part { position:absolute; top:100px; left:50%; transform:translateX(-50%); padding:18px 44px; border-radius:9999px; white-space:nowrap;
    border:4px solid #0AF0F0; background:rgba(10,240,240,.12); font-size:52px; letter-spacing:.1em; }
  .t1 { position:absolute; top:250px; left:0; right:0; text-align:center; font-size:140px; line-height:1; letter-spacing:-.03em; }
  .t2 { position:absolute; top:400px; left:0; right:0; text-align:center; font-size:190px; line-height:1; letter-spacing:-.04em; }
  .cal { position:absolute; left:60px; top:690px; z-index:3; width:560px; border-radius:26px; overflow:hidden; background:#F5F1E8; color:#0E1116;
    box-shadow:0 30px 90px rgba(0,0,0,.6); transform:rotate(-3deg); }
  .cal .h { background:#FFB020; font-size:46px; letter-spacing:.08em; text-align:center; padding:16px 0; }
  .cal .row { display:flex; justify-content:space-between; align-items:center; padding:20px 32px; font-size:48px; white-space:nowrap; gap:24px; }
  .cal .row + .row { border-top:4px dashed rgba(14,17,22,.2); }
  .cal .row b { color:#B86E00; } .cal .row b.z { color:#D0202A; }
  #raj { position:absolute; left:-200px; top:820px; width:2048px; height:1152px; z-index:2; filter:drop-shadow(0 0 40px rgba(10,240,240,.35)) brightness(1.05) contrast(1.06); }
  .badge { position:absolute; left:40px; top:1250px; transform:rotate(-4deg); z-index:4; background:#FFB020; color:#0E1116;
    font-size:62px; line-height:1.1; padding:20px 40px; border-radius:24px; white-space:nowrap; box-shadow:0 20px 60px rgba(255,176,32,.45); }
  .brand { position:absolute; z-index:5; bottom:60px; left:0; right:0; text-align:center; font-size:46px; color:#F5F1E8; letter-spacing:.06em; text-shadow:0 0 18px #000,0 4px 14px #000; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="part">PAISA SAMJHO · 1/20</div>
  <div class="t1">Salary kahan</div>
  <div class="t2 r">gayab?</div>
  <div class="cal"><div class="h">BANK BALANCE</div>
    <div class="row"><span>1 tareekh</span><b>₹1,00,000</b></div>
    <div class="row"><span>25 tareekh</span><b class="z">₹0</b></div></div>
  <img id="raj" src="img/raj-cutout.png">
  <div class="badge">3 DABBE<br>FORMULA!</div>
  <div class="brand">SAMJHO WITH RAJ · paisasamjhoraj.com</div>
</body></html>
